name: Production CI/CD Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run code linter
        run: flake8 app/ tests/

      - name: Run unit test suite
        run: pytest tests/ --junitxml=test-results.xml

  deploy:
    needs: test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: Trigger Production Deployment
        run: |
          if [ -z "${{ secrets.PROD_DEPLOY_WEBHOOK }}" ]; then
            echo "ERROR: PROD_DEPLOY_WEBHOOK secret is not set in repository settings."
            exit 1
          fi
          echo "CI tests passed. Initiating production rollout..."
          response=$(curl -s -o /dev/null -w "%{http_code}" -X POST "${{ secrets.PROD_DEPLOY_WEBHOOK }}")
          if [[ "$response" -lt 200 || "$response" -ge 300 ]]; then
            echo "Deployment trigger failed with HTTP $response"
            exit 1
          fi
          echo "Deployment hook triggered successfully (HTTP $response)."